name: Daily MLB picks

on:
  schedule:
    - cron: "0 14 * * *"    # 14:00 UTC = 10:00 AM Eastern — predictions + opening line
    - cron: "30 22 * * *"   # 22:30 UTC = 6:30 PM Eastern — closing line only, near
                             # the earliest MLB first pitches; adjust to taste
  workflow_dispatch: {}      # lets you trigger it manually from the phone too

permissions:
  contents: write

jobs:
  run:
    if: github.event.schedule != '30 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run the predictor for today's slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python predict.py --all --out today

      - name: Save results back to the repository
        run: |
          git config user.name "mlb-predictor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A today picks_log.csv || true
          git add calibration.html market.html 2>/dev/null || true
          git commit -m "Daily picks $(date -u +%F)" || echo "nothing new"
          git push

  closing:
    if: github.event.schedule == '30 22 * * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture the closing line for today's picks
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python predict.py --closing

      - name: Save the updated log back to the repository
        run: |
          git config user.name "mlb-predictor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks_log.csv || true
          git add market.html 2>/dev/null || true
          git commit -m "Closing line $(date -u +%F)" || echo "nothing new"
          git push
